<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#101821"/><text x="800" y="55" text-anchor="middle" fill="#edf2f4" font-size="34" font-family="sans-serif">《雾锁黑石》空间关系总图</text>
<text x="800" y="100" text-anchor="middle" fill="#9fb2c0" font-size="20" font-family="sans-serif">统一方向：山路自北入镇；主街向南延伸至社区医院正门；医院后院接地下应急通道，通道通往废弃基站</text>
<rect x="70" y="150" width="1460" height="780" rx="24" fill="#1a2731" stroke="#5d7180" stroke-width="3"/>
<rect x="570" y="170" width="460" height="80" rx="14" fill="#344b58" stroke="#99b3c2" stroke-width="2"/><text x="800" y="220" text-anchor="middle" fill="#fff" font-size="26" font-family="sans-serif">北侧盘山公路／滑坡封路</text>
<path d="M800 250 L800 355" stroke="#d4c7a1" stroke-width="36"/><path d="M800 250 L800 355" stroke="#27323a" stroke-width="3" stroke-dasharray="20 18"/>
<rect x="690" y="355" width="220" height="300" rx="12" fill="#45545d" stroke="#a8b7c0" stroke-width="2"/><text x="800" y="465" text-anchor="middle" fill="#fff" font-size="28" font-family="sans-serif">黑石镇主街</text><text x="800" y="505" text-anchor="middle" fill="#c8d2d8" font-size="18" font-family="sans-serif">两侧商铺、巷道、积水路面</text><text x="800" y="544" text-anchor="middle" fill="#c8d2d8" font-size="18" font-family="sans-serif">林默沿主街向南奔向医院</text>
<rect x="240" y="405" width="300" height="170" rx="12" fill="#273a44" stroke="#738894" stroke-width="2"/><text x="390" y="480" text-anchor="middle" fill="#eaf0f2" font-size="24" font-family="sans-serif">临街商铺区</text><text x="390" y="520" text-anchor="middle" fill="#aebdc5" font-size="17" font-family="sans-serif">巷口与雨水积洼</text>
<rect x="1060" y="405" width="300" height="170" rx="12" fill="#273a44" stroke="#738894" stroke-width="2"/><text x="1210" y="480" text-anchor="middle" fill="#eaf0f2" font-size="24" font-family="sans-serif">窄巷／追逐支路</text><text x="1210" y="520" text-anchor="middle" fill="#aebdc5" font-size="17" font-family="sans-serif">与主街相连，不穿过医院</text>
<path d="M800 655 L800 700" stroke="#d4c7a1" stroke-width="36"/><path d="M800 655 L800 700" stroke="#27323a" stroke-width="3" stroke-dasharray="20 18"/>
<rect x="470" y="700" width="660" height="190" rx="16" fill="#354b48" stroke="#b2c5a9" stroke-width="3"/><text x="800" y="745" text-anchor="middle" fill="#fff" font-size="28" font-family="sans-serif">社区医院（同一栋建筑）</text>
<rect x="500" y="770" width="250" height="90" rx="10" fill="#52645e" stroke="#cad5ce" stroke-width="2"/><text x="625" y="825" text-anchor="middle" fill="#fff" font-size="22" font-family="sans-serif">正门／临街大厅</text>
<rect x="850" y="770" width="250" height="90" rx="10" fill="#52645e" stroke="#cad5ce" stroke-width="2"/><text x="975" y="810" text-anchor="middle" fill="#fff" font-size="20" font-family="sans-serif">后院服务门</text><text x="975" y="840" text-anchor="middle" fill="#e1e8e3" font-size="16" font-family="sans-serif">大厅后走廊可达</text>
<path d="M975 860 L975 910 L1330 910" fill="none" stroke="#77b9c2" stroke-width="14" stroke-dasharray="18 10"/><rect x="1240" y="850" width="250" height="95" rx="12" fill="#2c4951" stroke="#77b9c2" stroke-width="2"/><text x="1365" y="892" text-anchor="middle" fill="#e7f4f4" font-size="20" font-family="sans-serif">地下应急通道</text><text x="1365" y="920" text-anchor="middle" fill="#bfd5d7" font-size="16" font-family="sans-serif">尽头：废弃基站</text>
<path d="M510 930 L510 875" stroke="#f0c674" stroke-width="4" marker-end="url(#arrow)"/><text x="320" y="910" fill="#f0c674" font-size="18" font-family="sans-serif">主线行动方向：山路 → 主街 → 医院正门 → 后院服务门 → 地下通道 → 基站</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0c674"/></marker></defs>
</svg>
